name: Socra AI
description: 'Socra AI operates Socra Tutor (소크라 튜터), a Korean-market, AI-powered education
  service that describes itself as an intelligent AI answer-comparison service — students submit
  problems and Socra compares and evaluates candidate answers using AI to help them learn. It is a
  consumer-facing edtech mobile/web application rather than a developer platform; as of this profile
  no public API, developer portal, or technical documentation could be found. Socra AI was surfaced
  as a portfolio company of SoftBank Vision Fund and added to the API Evangelist network for
  enrichment tracking.'
